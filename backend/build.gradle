plugins {
    id 'war'
    id 'eclipse-wtp'
}

group = 'com.provit'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

def springVersion = '5.3.39'
def slf4jVersion = '1.7.36'
def logbackVersion = '1.2.13'
def jacksonVersion = '2.15.4'
def lombokVersion = '1.18.30'
def jjwtVersion = '0.12.6'

dependencies {
    implementation("org.springframework:spring-context:${springVersion}") {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"
    implementation "org.springframework:spring-tx:${springVersion}"
    implementation "org.springframework:spring-context-support:${springVersion}"

    implementation 'com.oracle.database.jdbc:ojdbc8:19.3.0.0'
    implementation 'com.zaxxer:HikariCP:4.0.3'
    implementation 'org.mybatis:mybatis:3.5.16'
    implementation 'org.mybatis:mybatis-spring:2.1.2'

    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Supplied by Tomcat 9; available to tests but excluded from the WAR.
    providedCompile 'javax.servlet:javax.servlet-api:4.0.1'
    providedCompile 'javax.servlet.jsp:javax.servlet.jsp-api:2.3.3'
    implementation 'javax.servlet:jstl:1.2'

    implementation("org.slf4j:slf4j-api:${slf4jVersion}") {
        // Maven's direct version wins over HikariCP's SLF4J 2 alpha dependency.
        version { strictly(slf4jVersion) }
    }
    runtimeOnly "org.slf4j:jcl-over-slf4j:${slf4jVersion}"
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"

    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    implementation 'org.springframework.security:spring-security-crypto:5.8.11'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'com.sun.mail:javax.mail:1.6.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.springframework:spring-test:${springVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(Test).configureEach {
    useJUnit()
    workingDir = projectDir
    systemProperty 'file.encoding', 'UTF-8'
    // Preserve existing opt-in Oracle/OpenAI flags in the forked test JVM.
    systemProperties System.properties.findAll { key, value -> key.startsWith('provit.') }
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

def externalApiTests = [
    'com/provit/client/fortune/SazuApiClientTest.class',
    'com/provit/service/fortune/FortuneServiceTest.class'
]

tasks.named('test', Test) {
    // These tests read local API credentials and call the real fortune service.
    exclude externalApiTests
}

tasks.register('externalApiTest', Test) {
    description = 'Runs tests that call the real external fortune API using local credentials.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include externalApiTests
    shouldRunAfter tasks.named('test')
}

tasks.named('war', War) {
    archiveFileName = 'backend.war'
}

eclipse {
    wtp {
        component {
            contextPath = '/'
        }
    }
}
