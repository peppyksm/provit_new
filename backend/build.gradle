plugins {
    id 'java'
    id 'eclipse'
    id 'org.springframework.boot' version '4.1.2'
}

group = 'com.provit'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

def jjwtVersion = '0.12.6'

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    testAnnotationProcessor platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    implementation('org.springframework.boot:spring-boot-starter-webmvc') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-jackson'
    }
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // Preserve the existing Jackson 2 DTO/JSON contract during the Boot migration.
    implementation 'org.springframework.boot:spring-boot-jackson2'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.jsoup:jsoup:1.17.2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'junit:junit'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    // Spring 6+ resolves unlabelled @RequestParam/@PathVariable names via reflection.
    options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir = projectDir
    systemProperty 'file.encoding', 'UTF-8'
    // Forward database and optional live API test flags to the test JVM.
    systemProperties System.properties.findAll { key, value -> key.startsWith('provit.') }
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

def externalApiTests = [
    'com/provit/client/fortune/SazuApiClientTest.class',
    'com/provit/service/fortune/FortuneServiceTest.class'
]

tasks.named('test', Test) {
    // These tests read local API credentials and call the real fortune service.
    exclude externalApiTests
}

tasks.register('externalApiTest', Test) {
    description = 'Runs tests that call the real external fortune API using local credentials.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include externalApiTests
    shouldRunAfter tasks.named('test')
}

tasks.named('bootJar') {
    archiveFileName = 'backend.jar'
}

tasks.named('jar') {
    enabled = false
}
