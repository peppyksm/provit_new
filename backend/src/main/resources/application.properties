spring.application.name=provit-backend
spring.config.import=optional:classpath:database.properties,optional:classpath:api.properties,optional:file:./config/database.properties,optional:file:./config/api.properties

server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mvc.servlet.load-on-startup=1
spring.web.resources.add-mappings=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=0B

spring.datasource.driver-class-name=${db.driverClassName:org.postgresql.Driver}
spring.datasource.url=${db.url:jdbc:postgresql://localhost:5432/provit_new}
spring.datasource.username=${db.username:provit}
spring.datasource.password=${db.password:}
spring.datasource.hikari.maximum-pool-size=${db.maxPoolSize:10}
spring.datasource.hikari.minimum-idle=${db.minIdle:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Seoul'
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.mail.host=${mail.host:smtp.gmail.com}
spring.mail.port=${mail.port:587}
spring.mail.username=${mail.username:}
spring.mail.password=${mail.password:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=${mail.smtp.auth:true}
spring.mail.properties.mail.smtp.starttls.enable=${mail.smtp.starttls.enable:true}
spring.mail.properties.mail.debug=false

# Spring MVC previously wrote java.util.Date as epoch milliseconds.
spring.http.converters.preferred-json-mapper=jackson2
spring.jackson2.serialization.write-dates-as-timestamps=true
spring.aop.proxy-target-class=false
spring.task.scheduling.pool.size=2
provit.scheduling.enabled=true
